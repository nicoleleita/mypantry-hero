<head>

  <style>
    :root { --ink-teal:#164a4a; --sea:#2a7b7b; --leaf:#2ecc71; --mist:#f0f7f6; --paper:#fafafa; --text:#24312f; --muted:#5b6f6c; }
    * { box-sizing: border-box; }
    body { font-family:'Nunito Sans',Arial,sans-serif; margin:0; background:var(--paper); color:var(--text); line-height:1.7; }
    header { background:var(--ink-teal); color:#fff; padding:40px 20px; text-align:center; }
    header a { color:#fff; text-decoration:none; font-weight:800; }
    h1 { font-family:'Fraunces',Georgia,serif; margin:10px 0 0; font-size:2em; }
    main { max-width:640px; margin:0 auto; padding:60px 20px 80px; text-align:center; }
    .card { background:#fff; border:1px solid #e3edeb; border-radius:16px; padding:40px 30px; }
    .card h2 { font-family:'Fraunces',Georgia,serif; color:var(--ink-teal); margin:0 0 10px; }
    .card p { color:var(--muted); }
    .email {
      display:inline-block; margin-top:16px; background:var(--leaf); color:#fff;
      font-weight:800; text-decoration:none; padding:14px 28px; border-radius:10px;
    }
    footer { background:#0e3535; color:#cfe0de; text-align:center; padding:28px 20px; font-size:0.9em; }
    footer a { color:#fff; font-weight:700; }
  </style>
